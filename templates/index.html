<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympic Report Analysis</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #172033;
        }
        header {
            background: #101d3a;
            color: white;
            padding: 22px 5%;
        }
        header h1 { margin: 0 0 7px; font-size: 26px; }
        header p { margin: 0; color: #d5deef; }
        main { width:  min(1400px, 96%); margin: 24px auto; }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 16px;
        }
        .tab {
            border: 0;
            border-radius: 7px;
            padding: 12px 20px;
            background: #e1e7f0;
            color: #172033;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .tab.active { background: #2457c5; color: white; }
        .external {
            margin-left: auto;
            color: #2457c5;
            text-decoration: none;
            font-weight: 700;
        }
        .viewer {
            background: white;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 3px 15px rgba(20, 35, 60, .09);
        }
        iframe {
            display: block;
            width: 100%;
            height: 78vh;
            min-height: 600px;
            border: 0;
        }
        footer {
            text-align: center;
            color: #687386;
            padding: 18px;
            font-size: 13px;
        }
        @media (max-width: 600px) {
            header h1 { font-size: 21px; }
            main { width: 94%; }
            iframe { height: 72vh; min-height: 520px; }
            .external { margin-left: 0; width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Olympic Report Analysis</h1>
        <p>Explore the Olympic dashboard and interactive story</p>
    </header>

    <main>
        <nav class="toolbar" aria-label="Tableau views">
            <button class="tab active" id="dashboardTab"
                    onclick="showView('dashboard')">Dashboard</button>
            <button class="tab" id="storyTab"
                    onclick="showView('story')">Story</button>
            <a class="external" id="openTableau" href="{{ dashboard_url }}"
               target="_blank" rel="noopener noreferrer">Open in Tableau ↗</a>
        </nav>

        <section class="viewer">
            <iframe
                id="tableauFrame"
                src="{{ dashboard_url }}"
                title="Olympic Tableau Dashboard"
                allowfullscreen>
            </iframe>
        </section>
    </main>

    <footer>Interactive visualizations are hosted on Tableau Public.</footer>

    <script>
        const views = {
            dashboard: {
                url: {{ dashboard_url | tojson }},
                title: "Olympic Tableau Dashboard"
            },
            story: {
                url: {{ story_url | tojson }},
                title: "Olympic Tableau Story"
            }
        };

        function showView(viewName) {
            const view = views[viewName];
            document.getElementById("tableauFrame").src = view.url;
            document.getElementById("tableauFrame").title = view.title;

            document.getElementById("dashboardTab")
                .classList.toggle("active", viewName === "dashboard");
            document.getElementById("storyTab")
                .classList.toggle("active", viewName === "story");

            document.getElementById("openTableau").href = view.url;
        }
    </script>
</body>
</html>
